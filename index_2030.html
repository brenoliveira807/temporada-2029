<!DOCTYPE html>

<body style="background: linear-gradient(180deg, #0b1938 47.99%, #14191d 100%);"> 

    <div class="container">
        <div class="header-competicao">

            <div class="competicao">

        <!-- DRAW - Corinthians 2x2 Grêmio -->
<div class="matches-row">

</div>
<!-- VICTORY - Bragantino 1x3 Corinthians -->

</div>
