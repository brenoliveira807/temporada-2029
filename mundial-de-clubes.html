<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Copa do Brasil</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container-mundial">
        <div class="header-competicao">
            <div class="temporada">
                <div class="line"></div>
                <div class="texto-temporada">Temporada 2030</div>
            </div>
             <div class="competicao">
                <div class="logo-competicao-mundial">
                    <img src=".\escudos\Intercontinental-cup.png" width="100" alt="Logo">
                </div>
                <div class="nome-competicao">Mundial de Clubes da FIFA 2030</div>
            </div>
          
            <div class="temporada">
                <div class="texto-temporada">Corinthians Paulista</div>
                <div class="line"></div>
            </div>
        </div>
        <div class="tabela">
            <div class="fase">
                <div class="line"></div>
                <div class="texto-fase-de-grupos">Fase de Grupos</div>
                <div class="line"></div>
            </div>

<!-- VITORIA - Corinthians 4x1 Arsenal -->
<div class="matches-row">
    <div class="indicator indicator-victory"></div>
    <div class="row">
        <div class="time-casa">
            <div class="nome-do-time-casa">Corinthians</div>
            <div class="img-wrapper"><img src="./escudos/corinthians-logo-footylogos-320.webp" alt="Corinthians"></div>
        </div>

        <div class="placar">
            <div class="ponto-casa">4</div>
            <div class="versus">X</div>
            <div class="ponto-visitante">1</div>
        </div>

        <div class="time-visitante">
            <div class="img-wrapper"><img src="./escudos/arsenal-logo-footylogos-320.webp" alt="Arsenal"></div>
            <div class="nome-do-time-fora">Arsenal</div>
        </div>
    </div>
</div>
<!-- DERROTA - Cruzeiro 2x1 Corinthians -->
<div class="matches-row">
    <div class="indicator indicator-defeat"></div>
    <div class="row">
        <div class="time-casa">
            <div class="nome-do-time-casa">Cruzeiro</div>
            <div class="img-wrapper"><img src="./escudos/cruzeiro-logo-footylogos-320.webp" alt="Cruzeiro"></div>
        </div>

        <div class="placar">
            <div class="ponto-casa">2</div>
            <div class="versus">X</div>
            <div class="ponto-visitante">1</div>
        </div>

        <div class="time-visitante">
            <div class="img-wrapper"><img src="./escudos/corinthians-logo-footylogos-320.webp" alt="Corinthians"></div>
            <div class="nome-do-time-fora">Corinthians</div>
        </div>
    </div>
</div>
<!-- EMPATE - Al-Hilal 0x0 Corinthians -->
<div class="matches-row">
    <div class="indicator indicator-draw"></div>
    <div class="row">
        <div class="time-casa">
            <div class="nome-do-time-casa">Al-Hilal</div>
            <div class="img-wrapper"><img src="./escudos/al-hilal-logo-footylogos-320.webp" alt="Al-Hilal"></div>
        </div>

        <div class="placar">
            <div class="ponto-casa">0</div>
            <div class="versus">X</div>
            <div class="ponto-visitante">0</div>
        </div>

        <div class="time-visitante">
            <div class="img-wrapper"><img src="./escudos/corinthians-logo-footylogos-320.webp" alt="Corinthians"></div>
            <div class="nome-do-time-fora">Corinthians</div>
        </div>
    </div>
</div>
  <div class="fase">
                <div class="line"></div>
                <div class="texto-fase-de-grupos">Oitava de final</div>
                <div class="line"></div>
            </div>
<!-- DERROTA - Corinthians 1x1 Rangers -->
<div class="matches-row">
    <div class="indicator indicator-defeat"></div>
    <div class="row">
        <div class="time-casa">
            <div class="nome-do-time-casa">Corinthians</div>
            <div class="img-wrapper"><img src="./escudos/corinthians-logo-footylogos-320.webp" alt="Corinthians"></div>
        </div>

        <div class="placar">
            <div class="ponto-casa">1 (2)</div>
            <div class="versus">X</div>
            <div class="ponto-visitante">1 (3)</div>
        </div>

        <div class="time-visitante">
            <div class="img-wrapper"><img src="./escudos/rangers-logo-footylogos.png" alt="Rangers"></div>
            <div class="nome-do-time-fora">Rangers</div>
        </div>
    </div>
</div>


           
<!-- Div finalista time campeão -->
<div class="finalist">
  <div class="time-campeao">
    <div class="img-wrapper"><img src=".\escudos\chelsea-logo-footylogos-320.webp" alt="Chelsea"></div>
    <div class="trofeu">🏆</div>
    <div class="time-campeao-text">Chelsea</div>
    <div class="titulo">Campeão do Mundial de Clubes FIFA</div>
  </div>
</div>

</div>


</body>
</html>
