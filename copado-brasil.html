    <style>
        body {
            font-family: "Titillium Web", sans-serif;

        .container {
            display: flex;
            height: 100%;
            padding: 86px 0;

            align-items: center;
            gap: 32px;
            align-self: stretch;
            background: linear-gradient(180deg, #14191d 47.99%, #0C190C 100%);

        }

        .navegador {

            gap: 8px;
        }

        .botao {

            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: transparent;
            transition: border 0.2s, background 0.2s;
        }

        .botao:hover {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.15);
        }

        .botao.pressed {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #FFF;
        }

        .botao-texto {
            color: #FFF;

            font-family: "Titillium Web";
            font-size: 14px;
            font-style: normal;
            font-weight: 400;
            line-height: normal;
        }

        .botao.pressed .botao-texto {
            color: #1E1E1E;

            font-family: "Titillium Web";
            font-size: 14px;
            font-style: normal;
            font-weight: 400;
            line-height: normal;

        .line {

            align-items: center;

            width: 100px;
            height: 100px;
            aspect-ratio: 1/1;
            border-radius: 1000px;
            border: 4px solid #379000;
            background: #FFF;
        }

        .logo-competicao img {
            width: 100%;
            height: 100%;
            object-fit: contain;

            font-weight: 400;
            line-height: normal;

            align-items: center;
            align-self: stretch;
        }

            width: 2px;
            height: 64px;
            background: #0CBD0C;

            width: 2px;
            height: 64px;
            background: #C7C7C7;
        }
        .indicator-defeat {
            width: 2px;
            height: 64px;
            background: #FF0004;
