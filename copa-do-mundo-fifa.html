<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Copa do Brasil</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">

</head>
<body>

<!-- Objeto animado no background (fixo na rolagem) -->
<div style="
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 870px;
    height: 870px;
    flex-shrink: 0;
    aspect-ratio: 1/1;
    border-radius: 870px;
     background: linear-gradient(45deg, 
   rgba(0, 62, 169, 1),     
   rgba(155, 36, 143, 1),   
   rgba(255, 204, 0, 1)    
  );
    filter: blur(250px);
    animation: kf_120_594_scale_0 2s linear;
    animation-iteration-count: infinite;
    animation-direction: alternate;
    z-index: -1;


"></div>

<style>
@keyframes kf_120_594_scale_0 {
    0% { 
        width: 870px;
        height: 870px;
    }  
    100% { 
        width: 1200px;
        height: 1200px;
    } 
}
</style>
    <div class="container-mundial">
        <div class="header-competicao">
            <div class="temporada">
                <button class="botao" onclick="window.location.href='./home.html'">
                    <span class="botao-texto">Home</span>
                </button>
                <div class="line"></div>
                <div class="texto-temporada">Temporada 2030</div>
            </div>
             <div class="competicao">
                <div class="logo-competicao-mundial">
                   <video src="./escudos/fifa-world-cup.mp4" autoplay loop muted playsinline>
        </video>
                </div>
                <div class="nome-competicao">Copa do Mundo FIFA 2030</div>
            </div>
          
            <div class="temporada">
                <div class="texto-temporada">Seleção Japonesa</div>
                <div class="line"></div>
            </div>
        </div>
        <div class="tabela">
            <div class="fase">
                <div class="line"></div>
                <div class="texto-fase-de-grupos">Fase de Grupos</div>
                <div class="line"></div>
            </div>
<!-- VITÓRIA - Japão 3x2 Estados Unidos -->
<div class="matches-row">
    <div class="indicator indicator-victory"></div>
    <div class="row">
        <div class="time-casa">
            <div class="nome-do-time-casa">Japão</div>
            <div class="img-wrapper"><img src="./escudos/japan-national-team-logo-footylogos-320.webp" alt="Japão"></div>
        </div>

        <div class="placar">
            <div class="ponto-casa">3</div>
            <div class="versus">X</div>
            <div class="ponto-visitante">2</div>
        </div>

        <div class="time-visitante">
            <div class="img-wrapper"><img src="./escudos/usa-national-team-logo-footylogos-320.webp" alt="Estados Unidos"></div>
            <div class="nome-do-time-fora">Estados Unidos</div>
        </div>
    </div>
</div>
<!-- VITÓRIA - Espanha 1x0 Japão -->
<div class="matches-row">

        </div>

        <div class="placar">

        </div>

            <div class="img-wrapper"><img src="./escudos/japan-national-team-logo-footylogos-320.webp" alt="Japão"></div>
            <div class="nome-do-time-fora">Japão</div>
        </div>
    </div>
</div>
<!-- DERROTA - Japão 1x2 Turquia -->
<div class="matches-row">
    <div class="indicator indicator-defeat"></div>
    <div class="row">
        <div class="time-casa">
            <div class="nome-do-time-casa">Japão</div>
            <div class="img-wrapper"><img src="./escudos/japan-national-team-logo-footylogos-320.webp" alt="Japão"></div>
        </div>

        <div class="placar">
            <div class="ponto-casa">1</div>
            <div class="versus">X</div>
            <div class="ponto-visitante">2</div>
        </div>

        <div class="time-visitante">

            <div class="nome-do-time-fora">Turquia</div>
        </div>
    </div>
</div>
 <div class="fase">

</div>

</html>
